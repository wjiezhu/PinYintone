# Render 蓝图（必须位于仓库根目录，Render 默认在根读取 render.yaml）。
# 仓库根是 iOS 工程，后端在 backend/ 子目录，用 rootDir 指明（monorepo 标准做法）。
# 用法：Render → New → Blueprint → 选本仓库；DATABASE_URL 填 Neon 连接串。
services:
  - type: web
    name: pinyintone-backend
    runtime: python
    rootDir: backend
    plan: starter             # 免费实例封锁对外 SMTP 端口（2025-09 起），邮箱验证码发不出去；付费实例也不会闲置休眠
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JWT_SECRET
        generateValue: true       # Render 自动生成强随机值
      - key: DATABASE_URL
        sync: false               # 手动填 Neon Postgres 连接串
      - key: APPLE_BUNDLE_IDS
        value: Joy.PinYintone     # Apple identityToken 的 aud
      - key: GOOGLE_CLIENT_IDS
        sync: false               # 手动填 Google Cloud 里建的 Web client id
      - key: ALLOW_LEGACY_UNVERIFIED_APPLE
        value: "true"             # 过渡开关，关掉的时机由人决定
      # Android 直接分发的新版本检查（/api/app-version/android），发新版时在 Render 后台填
      - key: ANDROID_LATEST_VERSION_CODE
        sync: false
      - key: ANDROID_LATEST_VERSION_NAME
        sync: false
      - key: ANDROID_MIN_VERSION_CODE
        sync: false
      - key: ANDROID_DOWNLOAD_URL
        sync: false
